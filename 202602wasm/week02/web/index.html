<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hello-wasm</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f8fafc;
      }

      main {
        width: min(640px, 92vw);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }

      #output {
        margin-top: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rust + WebAssembly (Week 2)</h1>

      <section>
        <h2>greet(name)</h2>
        <input id="name-input" type="text" value="WebAssembly" />
        <button id="run-greet" type="button">実行</button>
      </section>

      <section>
        <h2>sum(a, b)</h2>
        <input id="sum-a" type="number" value="2" />
        <input id="sum-b" type="number" value="3" />
        <button id="run-sum" type="button">実行</button>
      </section>

      <section>
        <h2>is_even(n)</h2>
        <input id="even-n" type="number" value="4" />
        <button id="run-even" type="button">実行</button>
      </section>

      <p id="output">未実行</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
